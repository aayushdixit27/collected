<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Collected — office</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap-wide">
  <p class="brand-mark office-header">Collected</p>

  <div class="office-controls">
    <div class="field-icon-wrap search-wrap">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="qInput" class="field" type="text" placeholder="Search address or container ID">
    </div>
    <div class="row2">
      <input id="fromInput" class="field" type="date">
      <input id="toInput" class="field" type="date">
    </div>
    <select id="statusSelect" class="field">
      <option value="">Any status</option>
      <option value="collected">Collected</option>
      <option value="delivered">Delivered</option>
      <option value="removed">Removed</option>
      <option value="not_collected">Could not collect</option>
    </select>
  </div>

  <p class="stat-line">
    <span class="stat-north" id="statCoverage">—</span><span class="stat-sub" id="statRecords">—</span><span class="stat-sub" id="statMedian">—</span>
  </p>

  <div id="results">
    <table class="results-table">
      <thead>
        <tr>
          <th></th>
          <th>Address</th>
          <th>Container</th>
          <th>Date, time</th>
          <th>Status</th>
          <th>Capture</th>
        </tr>
      </thead>
      <tbody id="resultsTbody"></tbody>
    </table>
    <div class="results-list" id="resultsList"></div>
  </div>

  <a class="footer-link" href="/">Driver capture</a>
</div>
<script src="/office.js"></script>
</body>
</html>
